    <title>مستشار التأمينات والمعاشات المصري</title>
    <meta name="description" content="المستشار الذكي للمواطنين المتعاملين مع الهيئة القومية للتأمين الاجتماعي وفقاً لأحكام القانون 148 لسنة 2019 ولائحته التنفيذية رقم 2437 لسنة 2021 والجداول والنماذج التأمينية المرفقة، مع إمكانية رفع وتحليل ملفات الـ PDF والردود بالعامية المصرية." />
    <meta property="og:title" content="مستشار التأمينات والمعاشات المصري" />
    <meta property="og:description" content="المستشار الذكي للمواطنين المتعاملين مع الهيئة القومية للتأمين الاجتماعي وفقاً لأحكام القانون 148 لسنة 2019 ولائحته التنفيذية رقم 2437 لسنة 2021 والجداول والنماذج التأمينية المرفقة، مع إمكانية رفع وتحليل ملفات الـ PDF والردود بالعامية المصرية." />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('PWA ServiceWorker registered successfully:', reg.scope);
            },
            (err) => {
              console.warn('PWA ServiceWorker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
